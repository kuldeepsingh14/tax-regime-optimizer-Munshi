# Render blueprint, read from the repo root on first deploy.
#
# The free tier gives 512 MB RAM, one shared CPU, and sleeps after ~15 minutes
# idle. Every choice below follows from those three facts.

services:
  - type: web
    name: taxopt-api
    runtime: python
    plan: free
    region: singapore # closest to India; lower latency than the default
    rootDir: backend # everything below runs relative to backend/

    # No model pre-cache: EMBEDDER=lexical below means FastEmbed is never
    # loaded, so downloading the ONNX weights would just add ~2 min to every
    # build for something that is never read.
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    # One worker. Two would double the memory for no throughput gain on a
    # single shared CPU, and the app is stateless so scaling is horizontal.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"

      # Comma-separated. Must include your Vercel URL or the browser blocks
      # every request with a CORS error that looks like the API is down.
      - key: ALLOWED_ORIGINS
        sync: false

      # auto | fastembed | lexical
      # MUST be lexical on the free tier. "auto" tries FastEmbed, which loads
      # ONNX Runtime plus the BGE model at request time; that exceeds the
      # 512 MB cap and the worker is OOM-killed mid-request, surfacing as a
      # 502 after ~44s on /api/v1/ask. Lexical (TF-IDF) needs no model and
      # answers instantly. Revisit only on a paid instance.
      - key: EMBEDDER
        value: lexical

      # Optional. Without it, extraction runs regex-only and escalates to
      # manual entry for non-standard Form 16 templates.
      - key: GROQ_API_KEY
        sync: false

      # Optional. Without it the corpus is served from the in-memory store,
      # which is genuinely fine at this corpus size.
      - key: PINECONE_API_KEY
        sync: false

      # Keeps pip from writing bytecode we never reuse across deploys.
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
